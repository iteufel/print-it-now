name: Prebuild

# Builds the binaries that ship in the npm package, so installing needs no C++
# toolchain. prebuildify lays them out as prebuilds/<platform>-<arch>/, which is
# the layout node-gyp-build looks in -- and the one Bun understands too.
#
# On a GitHub Release, the collected tarball is published to npm. workflow_dispatch
# is a dry run: it builds and packs, but does not publish.

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  prebuild:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: win32-x64, os: windows-2022 }
          - { target: win32-arm64, os: windows-11-arm }
          # GitHub's last x86_64 macOS image, retiring in August 2027. When it
          # goes, darwin-x64 will need a cross-build from an arm64 runner.
          - { target: darwin-x64, os: macos-15-intel }
          - { target: darwin-arm64, os: macos-15 }
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - name: Build the prebuilt addon
        run: npm run prebuild

      # PDFium goes in the same directory as the addon, because the loader looks
      # for pdfium.dll next to the .node file rather than relying on the DLL
      # search order. Staged after the build so nothing can clean it away.
      - name: Stage the pinned PDFium runtime
        if: startsWith(matrix.target, 'win32-')
        run: node scripts/fetch-pdfium.mjs --target ${{ matrix.target }}

      - name: Show what was produced
        shell: bash
        run: ls -lR prebuilds

      # A prebuild that silently fails to load is worse than having none at all,
      # because node-gyp-build would otherwise have fallen back to a source build.
      # Deleting build/ first makes sure it really is the prebuilt binary being
      # exercised, and describe() reaches all the way to the platform's printing
      # subsystem -- on Windows that means proving pdfium.dll was found next to
      # the addon, which is the part of the design most likely to break.
      - name: Verify the prebuilt addon loads
        shell: bash
        run: |
          rm -rf build
          node -e "
            const load = require('node-gyp-build');
            const addon = load(process.cwd());
            for (const name of ['print', 'listPrinters', 'describe', 'cancelJob', 'listJobs']) {
              if (typeof addon[name] !== 'function') {
                throw new Error('the prebuilt addon is missing ' + name);
              }
            }
            addon.describe().then((info) => {
              console.log('backend:', JSON.stringify(info));
              if (process.platform === 'win32' && !info.pdfiumVersion) {
                throw new Error('pdfium.dll was not found next to the prebuilt addon');
              }
            }).catch((error) => { console.error(error); process.exit(1); });
          "

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: prebuilds/
          if-no-files-found: error

  # glibc and musl are not ABI compatible, so Alpine needs its own binaries.
  # prebuildify's --tag-libc names them so node-gyp-build picks the right one.
  #
  # Build inside Docker rather than a job-level `container:`: JavaScript actions
  # (checkout, upload-artifact) are not supported in Alpine on arm64 runners.
  prebuild-musl:
    name: linux-${{ matrix.arch }}-musl
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify the musl prebuild in Alpine
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            node:22-alpine \
            sh -ec '
              apk add --no-cache python3 make g++ bash
              npm ci --ignore-scripts
              npm run prebuild
              ls -lR prebuilds
              rm -rf build
              node -e "
                const addon = require(\"node-gyp-build\")(process.cwd());
                if (typeof addon.print !== \"function\") {
                  throw new Error(\"the prebuilt addon is missing exports\");
                }
                console.log(\"the musl prebuild loads\");
              "
            '

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-linux-${{ matrix.arch }}-musl
          path: prebuilds/
          if-no-files-found: error

  collect:
    name: Collect prebuilds
    needs: [prebuild, prebuild-musl]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          path: prebuilds/
          merge-multiple: true

      - run: ls -lR prebuilds

      - name: Check every expected target is present
        run: |
          missing=0
          for target in win32-x64 win32-arm64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            if ! ls prebuilds/"$target"/*.node >/dev/null 2>&1; then
              echo "::error::no addon was built for $target"
              missing=1
            fi
          done
          # Only Windows ships PDFium; CUPS reads PDF natively everywhere else.
          for target in win32-x64 win32-arm64; do
            if [ ! -f "prebuilds/$target/pdfium.dll" ]; then
              echo "::error::pdfium.dll is missing from prebuilds/$target"
              missing=1
            fi
          done
          exit "$missing"

      - run: npm ci --ignore-scripts
      - run: npm run build:ts

      - name: Build the publishable tarball
        run: npm pack --dry-run && npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: "*.tgz"
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: collect
    # workflow_dispatch is intentionally a dry run of the prebuild matrix.
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Required for npm Trusted Publishing / --provenance (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: npm-tarball
          path: .

      # Trusted Publishing needs npm >= 11.5.1. Node 22 ships an older CLI that
      # never attempts OIDC and fails with ENEEDAUTH even when a publisher is
      # configured. Node 24 bundles a new enough npm.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the release tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          tag="${{ github.event.release.tag_name }}"
          if [ "$tag" != "$expected" ]; then
            echo "::error::release tag '$tag' does not match package.json (expected '$expected')"
            exit 1
          fi

      - name: Publish the packed tarball
        env:
          # Only used on the automation-token fallback path below. Must not be
          # present during the OIDC attempt — an empty value still disables it.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          shopt -s nullglob
          tarballs=(*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one npm tarball, found: ${tarballs[*]:-none}"
            exit 1
          fi
          echo "Publishing ${tarballs[0]} with npm $(npm --version)"

          # setup-node with registry-url writes _authToken into ~/.npmrc. Any
          # _authToken line (even empty) makes npm skip Trusted Publishing.
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC" ]; then
            sed -i '/_authToken/d' "$NPMRC"
          fi
          unset NODE_AUTH_TOKEN

          set +e
          out=$(npm publish "${tarballs[0]}" --access public --provenance 2>&1)
          status=$?
          printf '%s\n' "$out"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::Trusted Publishing failed (see npm output above). Confirm the npm Trusted Publisher matches repo iteufel/print-it-now and workflow filename prebuild.yml, or set NPM_TOKEN to an Automation token."
            exit "$status"
          fi

          echo "OIDC publish did not succeed; retrying with NPM_TOKEN"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$HOME/.npmrc"
          export NODE_AUTH_TOKEN="$NPM_TOKEN"
          out=$(npm publish "${tarballs[0]}" --access public --provenance 2>&1)
          status=$?
          printf '%s\n' "$out"
          if [ "$status" -ne 0 ] && printf '%s\n' "$out" | grep -q 'EOTP'; then
            echo "::error::NPM_TOKEN must be an npm Automation token (not a classic or granular publish token). Tokens that require 2FA OTP cannot publish from CI."
          fi
          exit "$status"
